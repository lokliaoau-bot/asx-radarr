name: 每日更新澳股雷达

on:
  schedule:
    # ASX 收盘约 UTC 06:00；ASIC 空头文件 T+4 上午发布。
    # 取 UTC 08:30 = 悉尼 18:30/19:30，确保当天数据齐全。
    - cron: "30 8 * * 1-5"

  # 代码一推上来就重新部署，手机上不用再手动点 Run workflow。
  #
  # ⚠️ 这个 workflow 自己会把 cache/announcements.db 推回仓库。若不排除该路径，
  # 那次回写会再触发一轮构建、再回写……变成无限循环，把 Actions 额度烧光。
  # 双重保险：这里排除 cache/**，回写那步（见文件末尾）的提交信息里也带跳过标记。
  #
  # ⚠️⚠️ 加这个触发时踩过的坑：GitHub 会扫描本次推送 head commit 的【提交信息全文】，
  # 一旦出现跳过标记（skip-ci / ci-skip / no-ci 那几个方括号写法）就整个跳过 workflow。
  # 当时为了在提交信息里"说明"这道保险而原样写出了那个标记，结果 GitHub 照做，
  # 推上去毫无反应、Actions 里连一条记录都不生成，排查了很久。
  # 【以后在提交信息里提到这个机制，一律用文字描述，不要原样写出那个方括号标记。】
  push:
    branches: [main]
    paths-ignore:
      - 'cache/**'
      - '**.md'
      - '.gitignore'

  workflow_dispatch:        # 手机上也能手动触发（GitHub 网页 Run workflow）

permissions:
  contents: write        # 需要写权限把累积存档提交回仓库
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 缓存行情/空头/模型，避免每天从零重训（首次运行会是空的，属正常）
      - name: 取回缓存
        uses: actions/cache@v4
        with:
          path: cache
          key: asx-cache-${{ github.run_id }}
          restore-keys: |
            asx-cache-

      # ⚠️ 上一步会把缓存里那份**旧的** cache/announcements.db 解压出来，盖掉刚 checkout
      # 的仓库版本。仓库里的才是最全的（本地运行推上来的行也在里面），被盖掉就等于
      # 悄悄丢掉那些行。所以恢复缓存后立刻把它换回仓库版本。
      # （2026-10-15 ChatGPT 审查指出；这里用最小改法修，缓存键不变，避免一次冷启动重训。）
      - name: 存档以仓库版本为准
        run: git checkout -- cache/announcements.db

      - name: 运行分析并生成站点
        run: python run.py --publish

      # 存档是唯一不能事后重建的东西：不管后面推送成不成功，先留一份构建产物备份（保留 90 天）。
      - name: 备份当天存档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: announcements-archive-${{ github.run_id }}
          path: cache/announcements.db
          if-no-files-found: warn

      # 把累积的存档写回仓库。Actions 缓存会过期，仓库不会——
      # 公告只能取到最近5条，漏掉就永久丢失，所以这一步是"日积月累"的关键。
      - name: 回写累积存档
        run: |
          git config user.name  "asx-radar-bot"
          git config user.email "actions@github.com"
          # 推送被拒、需要变基时，存档冲突要并集合并（见 .gitattributes）。git 不会自动
          # 信任仓库里的驱动定义，云端每次都要配一遍——以前没配，冲突就直接变基失败、丢当天存档。
          git config merge.archivedb.name "union-merge the announcements archive"
          git config merge.archivedb.driver "python tools/merge_archive.py %O %A %B"
          git add -f cache/announcements.db
          if git diff --staged --quiet; then
            echo "存档无变化，跳过提交"
          else
            git commit -m "存档更新 $(date -u +%Y-%m-%d) [skip ci]"
            # 构建要跑一两分钟，期间完全可能有人往 main 推了代码。那样这里的 push
            # 会因为非快进被拒，这一步失败、整个构建标红，而且这次的存档就丢了——
            # 存档是唯一无法事后重建的东西（公告只能取最近几条），不能这么丢。
            # 所以：被拒就把本地这一条 commit 变基到最新远端再推，最多试三次。
            for i in 1 2 3; do
              if git push; then
                echo "存档已回写"
                break
              fi
              echo "推送被拒（远端有新提交），变基后重试 $i/3"
              git pull --rebase --autostash origin main || {
                echo "变基失败，放弃回写（不让整个构建失败）"
                break
              }
            done
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
