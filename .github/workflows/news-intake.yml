name: 收 AFR 简报

# Claude 云端例行任务每个交易日收盘后写一份 news/briefs/YYYY-MM-DD.json，推到 claude/ 开头的分支。
# 这里只做一件事：分支上【只改了简报文件】、而且用 main 上的校验程序检查通过 → 把它并进 main，
# 再触发「每日更新」重新部署。改了任何别的文件的分支一律不碰（那种改动走 Pull Request + 测试，见 AGENTS.md）。
# 校验程序来自 main，不来自分支，所以分支里的内容没法改掉检查规则。
on:
  push:
    # claude/news-request-* 是云端 Claude 请 GitHub 抓 AFR 标题用的（news-collect.yml），不是简报
    branches: ['claude/**', '!claude/news-request-**']

permissions:
  contents: write     # 把简报提交进 main、删掉用完的简报分支
  actions: write      # 触发「每日更新」：用 GITHUB_TOKEN 推送不会自动触发别的 workflow，只能手动调一次

concurrency:
  group: news-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 只收简报文件，校验通过才并进 main
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          # 同一分支连推两次（比如变基后强推）时，前一次运行可能已经收下并删掉了分支——这不是错误
          if ! git fetch origin "$BRANCH"; then
            echo "分支 $BRANCH 已经不在了（多半已被前一次运行收下并删除），什么都不做"
            exit 0
          fi
          ALL=$(git diff --name-only origin/main...FETCH_HEAD)
          FILES=$(git diff --name-only --diff-filter=AM origin/main...FETCH_HEAD)
          echo "分支 $BRANCH 改动的文件："
          echo "$ALL"
          if [ -z "$FILES" ]; then
            echo "没有新增或修改的简报，什么都不做"
            exit 0
          fi
          if echo "$ALL" | grep -vqE '^news/briefs/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$'; then
            echo "这个分支改了简报以外的文件，不自动合并（请开 Pull Request）"
            exit 0
          fi
          # 逐个校验；同一天 main 上已经是「分析版」时不收「标题版」（每日自动抓标题不能盖掉点按钮换来的分析）。
          # 校验不过会让这一步失败（Actions 里标红，方便发现）；被「不覆盖」挡下的不算失败。
          DAY=$(echo "$FILES" | head -1 | sed 's#.*/##; s#\.json$##')
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          ACCEPTED=$(python -m asxquant.news accept FETCH_HEAD $FILES 2>accept.log) || { cat accept.log; exit 1; }
          cat accept.log
          git config user.name  "asx-radar-bot"
          git config user.email "actions@github.com"
          if [ -z "$ACCEPTED" ]; then
            echo "没有需要并入的简报"
            # 记下结果（「已有分析版，标题版不覆盖」不是错误），云端的 confirm 据此不会误报
            python -m asxquant.news status intake ok "$(tail -n 2 accept.log | tr '\n' ' ')" "$DAY"
            git add news/inbox/_status.json
            git commit -q -m "AFR 收件记录 $DAY" && { git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; } || true; }
            case "$BRANCH" in
              claude/afr-brief-*) git push origin --delete "$BRANCH" || true ;;
            esac
            exit 0
          fi

          FILES="$ACCEPTED"
          # 数字核对：打开每条的来源网页逐个找出处，结果写进简报（页面上标出没找到的）。
          # 算错、大盘数字不对这种硬错误上面 accept 已经挡掉了；这里网页打不开之类的问题不挡发布。
          python -m asxquant.news verify $FILES || echo "数字核对没跑完，照常发布（页面不显示核对结果）"
          python -m asxquant.news status intake ok "并入 $(echo $FILES | tr '\n' ' ')" "$DAY"
          git add $FILES news/inbox/_status.json
          if git diff --staged --quiet; then
            echo "和 main 上的完全一样，不用提交"
          else
            git commit -m "AFR 简报 $(echo "$FILES" | sed 's#.*/##; s#\.json$##' | tr '\n' ' ')"
            # 每日更新也会往 main 推存档，撞上了就变基重推
            for i in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              echo "推送被拒，变基后重试 $i/3"
              git pull --rebase origin main
            done
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main || { echo "三次都没推上去"; exit 1; }
          fi

          gh workflow run daily.yml --ref main
          echo "已触发重新部署，约 10 分钟后手机上可见"
          case "$BRANCH" in
            claude/afr-brief-*) git push origin --delete "$BRANCH" || true ;;
          esac

      # 校验没过（或别的原因失败）：把原因写进 news/inbox/_status.json，云端 Claude 的 confirm
      # 几十秒内就能看到并告诉用户，不用干等
      - name: 失败时记下原因
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name  "asx-radar-bot"
          git config user.email "actions@github.com"
          git fetch -q origin main && git reset -q --hard origin/main
          python -m asxquant.news status intake fail "$(tail -n 4 accept.log 2>/dev/null | tr '\n' ' ')" "${DAY:-}"
          git add news/inbox/_status.json
          git commit -q -m "AFR 收件失败记录 ${DAY:-}" || exit 0
          for i in 1 2 3; do git push origin HEAD:main && break; git pull -q --rebase origin main; done
