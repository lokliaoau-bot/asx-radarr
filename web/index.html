<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>澳股市场雷达 · ASX Market Radar</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="澳股雷达">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow">
      <div class="brand">
        <h1>澳股市场雷达</h1>
        <div class="sub" id="asof">载入中 ...</div>
      </div>
      <div class="quote" id="quote"></div>
      <span id="live">
        <button class="ghost" id="btnExport" title="导出为单文件HTML，可放入云盘在任何电脑打开">⬇ 导出云盘版</button>
        <button class="ghost" id="btnHard" title="丢弃缓存，重新下载全部原始数据">强制重下</button>
        <button class="refresh" id="btnRefresh">⟳ 更新全部指标</button>
      </span>
    </div>
    <div class="prog" id="prog">
      <div class="bar"><i id="progBar"></i></div>
      <div class="msg" id="progMsg"></div>
    </div>
  </header>
  <div id="app"><div class="empty">正在载入 ...</div></div>
</div>
<script src="app.js"></script>
<script>
/* 看门狗：app.js 若有语法错误，整个脚本一行都不会执行——app.js 内部的 try/catch
   救不了自己，页面就永远停在"正在载入 ..."，看起来像卡住或没数据。这段独立的内联
   脚本不受 app.js 解析失败影响，超时后把真实原因显示出来。 */
window.addEventListener("error", function (e) { window.__BOOT_ERR__ = e && e.message; });
setTimeout(function () {
  var app = document.getElementById("app");
  if (!app || app.innerHTML.indexOf("正在载入") < 0) return;   // 已经渲染出来了
  var why = (typeof render === "undefined")
    ? "app.js 没能加载或解析（脚本报错，整份脚本都没执行）"
    : "脚本已加载，但数据一直没回来";
  app.innerHTML = '<div class="empty">页面没能载入。<br><br><b>' + why + '</b>' +
    '<br><br>先<b>强制刷新一次</b>（手机：关掉 App 再打开；电脑：Ctrl+F5）。' +
    (window.__BOOT_ERR__
      ? '<br><br><span style="font-size:12px;color:#5d6478">技术细节：' +
        String(window.__BOOT_ERR__).replace(/[<>&]/g, "") + '</span>'
      : "") + '</div>';
}, 12000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
